<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobil Vizör Efekti</title>
    <!-- MediaPipe JS Kütüphaneleri -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; padding: 0; background-color: black; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); }
        video { display: none; }
        
        /* ARAYÜZDEKİ NEON İMZA (HUD) */
        #hud-signature {
            position: absolute;
            bottom: 25px;
            right: 20px;
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff;
            font-size: 16px;
            text-align: right;
            z-index: 10;
            pointer-events: none;
            opacity: 0.85;
            letter-spacing: 2px;
            font-weight: bold;
        }
        #hud-signature span {
            font-size: 10px;
            color: #ffffff;
            text-shadow: none;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <!-- Ekranda Görünen Havalı Yazı -->
    <div id="hud-signature">
        <span>DEVELOPED BY</span><br>
        TOYGUN GALYAN
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');

        let flashFrames = 0;
        let lastPicTime = 0;
        let prevX1=0, prevY1=0, prevX2=0, prevY2=0;
        const smoothing = 0.6;

        function isFist(landmarks) {
            const tips = [8, 12, 16, 20];
            const dips = [6, 10, 14, 18];
            let curled = 0;
            for(let i=0; i<4; i++) {
                if(landmarks[tips[i]].y > landmarks[dips[i]].y) curled++;
            }
            return curled >= 3;
        }

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            const w = canvasElement.width;
            const h = canvasElement.height;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, w, h);

            canvasCtx.drawImage(results.image, 0, 0, w, h);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length === 2) {
                const hand1 = results.multiHandLandmarks[0];
                const hand2 = results.multiHandLandmarks[1];

                const fist1 = isFist(hand1);
                const fist2 = isFist(hand2);

                let x1 = hand1[9].x * w; let y1 = hand1[9].y * h;
                let x2 = hand2[9].x * w; let y2 = hand2[9].y * h;

                let startX = Math.min(x1, x2);
                let startY = Math.min(y1, y2);
                let endX = Math.max(x1, x2);
                let endY = Math.max(y1, y2);

                if (prevX1 === 0) {
                    prevX1 = startX; prevY1 = startY; prevX2 = endX; prevY2 = endY;
                } else {
                    startX = prevX1 * smoothing + startX * (1 - smoothing);
                    startY = prevY1 * smoothing + startY * (1 - smoothing);
                    endX = prevX2 * smoothing + endX * (1 - smoothing);
                    endY = prevY2 * smoothing + endY * (1 - smoothing);
                }
                prevX1 = startX; prevY1 = startY; prevX2 = endX; prevY2 = endY;

                let boxW = endX - startX;
                let boxH = endY - startY;

                if (boxW > 0 && boxH > 0) {
                    canvasCtx.save();
                    canvasCtx.beginPath();
                    canvasCtx.rect(startX, startY, boxW, boxH);
                    canvasCtx.clip();
                    canvasCtx.filter = 'grayscale(100%)';
                    canvasCtx.drawImage(results.image, 0, 0, w, h);
                    canvasCtx.restore();

                    canvasCtx.lineWidth = (fist1 && fist2) ? 6 : 4;
                    canvasCtx.strokeStyle = (fist1 && fist2) ? 'red' : 'yellow';
                    canvasCtx.strokeRect(startX, startY, boxW, boxH);

                    const now = Date.now();
                    if (fist1 && fist2 && (now - lastPicTime > 2000)) {
                        flashFrames = 4;
                        lastPicTime = now;
                        
                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = boxW; tempCanvas.height = boxH;
                        const tCtx = tempCanvas.getContext('2d');
                        tCtx.drawImage(canvasElement, startX, startY, boxW, boxH, 0, 0, boxW, boxH);
                        
                        // FOTOĞRAFA EKLENEN İMZA (FILIGRAN)
                        tCtx.font = "bold 18px Courier New";
                        tCtx.fillStyle = "rgba(0, 255, 255, 0.9)";
                        tCtx.textAlign = "right";
                        tCtx.fillText("by Toygun Galyan", boxW - 15, boxH - 15);
                        
                        const link = document.createElement('a');
                        link.download = `ironman_vizor_${now}.jpg`;
                        link.href = tempCanvas.toDataURL('image/jpeg');
                        link.click();
                    }
                }
            } else {
                prevX1 = 0; 
            }

            if (flashFrames > 0) {
                canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                canvasCtx.fillRect(0, 0, w, h);
                flashFrames--;
            }
            canvasCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 1280, height: 720, facingMode: 'user'
        });
        camera.start();
    </script>
</body>
